server.port=${APP_PORT:8072}
spring.config.import=optional:file:.env[.properties]

### DataSource configuration ###
spring.datasource.url=${ORDER_DB_LOCAL_URL:jdbc:postgresql://localhost:25432/order-db}
spring.datasource.username=${ORDER_DB_USER:sujay}
spring.datasource.password=${ORDER_DB_PWD:sujay_password}

### rabbitmq configuration ###
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PWD:guest}